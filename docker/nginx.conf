# Static hosting for photo-sheet-printer.
#
# The app makes no network requests at all once loaded, so the policy below
# can deny essentially everything and still leave the tool fully working.
# connect-src 'none' is the load-bearing line: it is what makes "your photos
# never leave the browser" enforced rather than merely promised.
#
# Note on nginx: an `add_header` inside a `location` block discards every
# add_header inherited from `server`. To keep the security headers applying
# everywhere, this file declares them once at server level and varies
# Cache-Control through a map instead of per-location add_header.

map $uri $psp_cache_control {
    default            "no-cache";
    ~*\.(?:css|js)$    "public, max-age=3600, must-revalidate";
}

server {
    listen       8081;
    listen       [::]:8081;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # This is a read-only site; nothing else is meaningful.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; manifest-src 'self'" always;
    add_header X-Content-Type-Options        "nosniff" always;
    add_header X-Frame-Options               "DENY" always;
    add_header Referrer-Policy               "no-referrer" always;
    add_header Permissions-Policy            "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy    "same-origin" always;
    add_header Cross-Origin-Resource-Policy  "same-origin" always;
    add_header Cache-Control                 $psp_cache_control always;

    # Uncomment once you are serving this over HTTPS, and only then. Sending
    # HSTS over plain HTTP on a LAN will pin the hostname to https for a year.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/css application/javascript image/svg+xml;
    # text/html is always gzipped by nginx and must not be listed again.
    # Photos are already compressed, so they are deliberately left out.

    location / {
        try_files $uri $uri/ =404;
        autoindex off;
    }

    # Hidden files are never part of this app.
    location ~ /\. {
        deny all;
    }
}
